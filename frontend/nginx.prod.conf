server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy a MeteoGalicia (webcams). En desarrollo lo hace el dev-server de Vite
    # (ver vite.config.ts); en producción, con estáticos servidos por nginx, hay
    # que replicarlo aquí. Se consume desde src/api/webcams.service.ts como
    # '/api/meteogalicia/...'. El resolver interno de Docker permite resolver el
    # host externo en tiempo de petición.
    location /api/meteogalicia/ {
        resolver 127.0.0.11 valid=30s;
        proxy_pass https://servizos.meteogalicia.gal/;
        proxy_ssl_server_name on;
        proxy_set_header Host servizos.meteogalicia.gal;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: rutas del cliente resueltas por index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché larga para assets con hash de contenido.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
