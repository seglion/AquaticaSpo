services:
  db:
    image: postgis/postgis:16-3.4
    container_name: aquatica_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend # Ruta a la carpeta con el Dockerfile de la API
      dockerfile: Dockerfile
    container_name: aquatica_api
    restart: always
    env_file:
      - ./.env # Carga las variables de entorno desde el archivo .env de la raíz
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy # La API no arrancará hasta que la BD esté lista
  cron:
    build:
      context: ./cron
      dockerfile: Dockerfile
    container_name: aquatica_cron
    restart: always
    env_file:
      - ./.env
    environment:
      # La URL interna para que el cron se comunique con la api
      - BACKEND_API_URL=http://api:8000
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - api
      - rabbitmq
  worker:
    build:
      context: . # Raíz del repo, para poder copiar alert_thresholds.json compartido
      dockerfile: forecastWorker/Dockerfile
    container_name: aquatica_worker
    restart: always
    env_file:
      - ./.env
    environment:
      - RABBITMQ_HOST=rabbitmq
      - BACKEND_API_URL=http://api:8000
    depends_on:
      - rabbitmq
  mailer:
    build:
      context: . # Raíz del repo, para poder copiar alert_thresholds.json compartido
      dockerfile: mailer/Dockerfile
    container_name: aquatica_mailer
    restart: always
    env_file:
      - ./.env
    environment:
      - RABBITMQ_HOST=rabbitmq
      - BACKEND_API_URL=http://api:8000
      - BINDING_KEY=forecast.#
    depends_on:
      - api
      - rabbitmq
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: aquatica_rabbitmq
    restart: always
    ports:
      # Puerto para la comunicación de la aplicación (AMQP)
      # Remapeado a 5673 en el host para convivir con otra app en el mismo
      # servidor que ya usa el 5672; la comunicación interna entre los
      # servicios de este stack sigue usando 'rabbitmq:5672' (red de Docker).
      - "5673:5672"
      # Puerto para la interfaz de gestión web
      - "15673:15672"
    environment:
      # Puedes dejar los usuarios por defecto (guest/guest) para desarrollo local
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}

  frontend:
    build:
      context: ./frontend
    container_name: aquatica_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # Umbrales de alerta compartidos (única fuente de verdad, ver alert_thresholds.json en la raíz)
      - ./alert_thresholds.json:/alert_thresholds.json:ro
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
